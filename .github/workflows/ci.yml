name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        staticcheck ./...

    - name: Run tests
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Run gosec
      uses: securego/gosec@master
      with:
        # Generated bindings (pkg/api/*_gen.go) are excluded — fix the pvegen
        # generator, not its output. Rule exclusions are domain-inherent to a
        # Proxmox API client: G117 (request structs carry credentials), G123
        # (deliberate certificate pinning), G402 (opt-in InsecureSkipVerify),
        # G704 (HTTP to a caller-configured host). Keep in sync with Makefile.
        args: >-
          -exclude-dir=examples -exclude-dir=cmd
          -exclude-dir=pkg/api/access -exclude-dir=pkg/api/cluster
          -exclude-dir=pkg/api/clusterstorage -exclude-dir=pkg/api/nodes
          -exclude-dir=pkg/api/pools -exclude-dir=pkg/api/version
          -exclude=G117,G123,G402,G704 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    # Compiles the library, cmd/pvegen, and every example (all one module).
    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build ./...
