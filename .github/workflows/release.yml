name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Run tests
      run: go test ./...

    - name: Create Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ github.ref_name }}" --title "Release ${{ github.ref_name }}" --generate-notes

    - name: Publish to pkg.go.dev
      env:
        GOPROXY: proxy.golang.org
      # Run outside the repo so the vendored module doesn't shadow the proxy fetch.
      run: cd "$(mktemp -d)" && go list -m "github.com/fivetwenty-io/proxmox-apiclient-go/v3@${{ github.ref_name }}"
