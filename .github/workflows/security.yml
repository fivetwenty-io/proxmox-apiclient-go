name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: self-hosted
    timeout-minutes: 15
    # Fork PRs must not run untrusted code on self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    # @latest is deliberate: govulncheck should always use the fresh vuln DB.
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  gosec:
    name: gosec
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    # Installed with the setup-go toolchain rather than the container action:
    # the container pins its own Go with GOTOOLCHAIN=local, which breaks when
    # go.mod requires a newer release than the image ships.
    #
    # Generated bindings (pkg/api/*_gen.go) are excluded — fix the pvegen
    # generator, not its output. Rule exclusions are domain-inherent to a
    # Proxmox API client: G117 (request structs carry credentials), G123
    # (deliberate certificate pinning), G402 (opt-in InsecureSkipVerify),
    # G704 (HTTP to a caller-configured host). Keep in sync with Makefile.
    - name: Run gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
        gosec -quiet -fmt text \
          -exclude-dir=examples -exclude-dir=cmd \
          -exclude-dir=pkg/api/access -exclude-dir=pkg/api/cluster \
          -exclude-dir=pkg/api/clusterstorage -exclude-dir=pkg/api/nodes \
          -exclude-dir=pkg/api/pools -exclude-dir=pkg/api/version \
          -exclude=G117,G123,G402,G704 ./...

  trivy:
    name: Trivy
    runs-on: self-hosted
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Trivy
      uses: aquasecurity/setup-trivy@v0.3.1
      with:
        cache: true

    # Same scan the Makefile's `make trivy` target runs; keep flags in sync.
    - name: Run Trivy scan
      run: trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --skip-dirs vendor .
